[project]
name = "textile-dyeing-intelligence"
version = "0.1.0"
description = "Local-first application for recording and reviewing textile dyeing operations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vipin T K" }]
dependencies = [
    "streamlit==1.66.0",
    "pydantic==2.13.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Streamlit entry points must adjust sys.path (via `import bootstrap`) before package imports.
"app.py" = ["E402"]
"pages/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
